<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Mouth">
  <defs>
    <!-- Matches the navy → crimson sweep used by the other body-area icons (stomach.png, head.png). -->
    <linearGradient id="mouthGrad" x1="8" y1="88" x2="88" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B1E6E" />
      <stop offset="0.5" stop-color="#8A1257" />
      <stop offset="1" stop-color="#E80044" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#mouthGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
