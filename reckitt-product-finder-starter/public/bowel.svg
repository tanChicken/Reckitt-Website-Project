<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Bowel">
  <defs>
    <!-- Matches the navy → crimson sweep used by the other body-area icons (stomach.png, head.png). -->
    <linearGradient id="bowelGrad" x1="8" y1="88" x2="88" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B1E6E" />
      <stop offset="0.5" stop-color="#8A1257" />
      <stop offset="1" stop-color="#E80044" />
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#bowelGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Large intestine: ascending colon (right), transverse colon (top), descending colon (left), rectum (centre) -->
    <path d="M22 78V36a14 14 0 0 1 28 0v10" />
    <path d="M50 46a12 12 0 0 0 24 0V34" />
    <path d="M74 34V26" />
    <path d="M22 78h52" />
    <!-- Small intestine coils inside the frame -->
    <path d="M36 56c8-4 16 2 16 8s-8 12-16 8" />
    <path d="M60 62c6 0 10 4 10 8" />
  </g>
</svg>
